name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: MicroserviceTemplateDb_Test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: my_psw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        run: dotnet test tests/EfMicroservice.Application.UnitTests/ --no-build -c Release --verbosity normal

      - name: Run integration tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=MicroserviceTemplateDb_Test;Username=postgres;Password=my_psw"
        run: dotnet test tests/EfMicroservice.Integration.Tests/ --no-build -c Release --verbosity normal
